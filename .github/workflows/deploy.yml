name: Deploy to NuGet.org

on:
  workflow_run:
    workflows: [ "Generate Release" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Download and deploy NuGet package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download the latest release's .nupkg file
          gh release download --repo "${{ github.repository }}" --pattern "*.nupkg" --dir .
          
          # Find the downloaded .nupkg file
          NUPKG=$(find . -maxdepth 1 -name "*.nupkg" -type f | head -1)
          
          if [ -z "$NUPKG" ]; then
            echo "Error: Failed to download .nupkg file"
            exit 1
          fi
          
          echo "Package downloaded: $NUPKG"
          
          # Push to NuGet.org using temporary OIDC-generated API key
          echo "Pushing to NuGet.org..."
          dotnet nuget push "$NUPKG" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          
          echo "Successfully deployed to NuGet.org"
