name: Update GitHub REST API clients

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-clients:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Kiota CLI
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Regenerate clients from upstream descriptions
        run: |
          kiota update --clean-output -o src/Octochris/GitHubEnterpriseCloud
          kiota update --clean-output -o src/Octochris/GitHubApi

      - name: Commit and push changes
        id: commit_changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="automation/kiota-update"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$branch" 2>/dev/null || true
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: regenerate Kiota clients"
          git push --force-with-lease origin "$branch"

      - name: Create or update pull request
        id: pull_request
        if: steps.commit_changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_branch="${{ github.event.repository.default_branch }}"
          head_branch="${{ steps.commit_changes.outputs.branch }}"

          pr_number="$(gh pr list --state open --head "$head_branch" --base "$base_branch" --json number --jq '.[0].number')"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "$base_branch" \
              --head "$head_branch" \
              --title "chore: regenerate Kiota clients" \
              --body "Automated Kiota client regeneration from lock files."
            pr_number="$(gh pr view "$head_branch" --json number --jq '.number')"
          else
            gh pr edit "$pr_number" \
              --title "chore: regenerate Kiota clients" \
              --body "Automated Kiota client regeneration from lock files."
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable PR auto-merge
        if: steps.commit_changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pull_request.outputs.number }}" --auto --squash --delete-branch
